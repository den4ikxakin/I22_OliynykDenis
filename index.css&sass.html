



<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <!-- Підключаємо згенерований CSS (після компіляції SCSS або Less) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Наш каталог товарів</h1>
    </header>

    <main class="catalog">
        <!-- Картка 1 -->
        <div class="card">
            <h2 class="card__title">Товар 1</h2>
            <p class="card__desc">Короткий опис першого чудового товару, який варто купити.</p>
            <span class="card__price">550 грн</span>
            <button class="card__btn">Купити</button>
        </div>

        <!-- Картка 2 -->
        <div class="card">
            <h2 class="card__title">Товар 2</h2>
            <p class="card__desc">Короткий опис другого товару з покращеними характеристиками.</p>
            <span class="card__price">1 200 грн</span>
            <button class="card__btn">Купити</button>
        </div>

        <!-- Картка 3 -->
        <div class="card">
            <h2 class="card__title">Товар 3</h2>
            <p class="card__desc">Короткий опис третього товару за суперціною для вигідної покупки.</p>
            <span class="card__price">890 грн</span>
            <button class="card__btn">Купити</button>
        </div>
    </main>

</body>
</html>
