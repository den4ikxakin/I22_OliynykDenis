<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота - Картка товару</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">
        <!-- Позначка «Акція» -->
        <div class="badge-promo">Акція</div>

        <!-- Зображення товару -->
        <div class="product-image">
            <img src="https://leo-shop.com.ua/content/images/26/59x78l80nn0/65843368981079.webp" alt="Товар">
        </div>

        <!-- Інформація про товар -->
        <div class="product-info">
            <h2 class="product-title">Ігровий геймпад</h2>
            <p class="product-description">Бездротовий геймпад із вібровідкликом та ергономічним дизайном.</p>
            
            <div class="product-footer">
                <span class="product-price">1 499 ₴</span>
                <button class="buy-button">Купити</button>
            </div>
        </div>
    </div>

</body>
</html>
